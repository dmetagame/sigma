name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge fmt --check
        working-directory: contracts
      - run: forge test -vv
        working-directory: contracts

  solidity-static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: astral-sh/setup-uv@v6
      - run: uv tool install slither-analyzer==0.11.5
      - run: >-
          slither .
          --filter-paths 'lib|test|script'
          --exclude-dependencies
          --exclude arbitrary-send-erc20,calls-loop,timestamp,unused-return
        working-directory: contracts

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
        working-directory: core
      - run: cargo test
        working-directory: core
      - run: cargo clippy -- -D warnings
        working-directory: core

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sigma/agent build
      - run: pnpm --filter @sigma/web exec tsc --noEmit
      - run: pnpm --filter @sigma/web build
      - run: pnpm audit --prod
