name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  FOUNDRY_VERSION: v1.5.0
  FOUNDRY_SHA256: 5cd98f9092bcc28be087939491f786b2bf3ed55e492996a409e29519b8ab4dc8

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install verified Foundry release
        run: |
          mkdir -p "$HOME/.foundry/bin"
          curl --fail --location --retry 3 \
            "https://github.com/foundry-rs/foundry/releases/download/${FOUNDRY_VERSION}/foundry_${FOUNDRY_VERSION}_linux_amd64.tar.gz" \
            --output /tmp/foundry.tar.gz
          echo "${FOUNDRY_SHA256}  /tmp/foundry.tar.gz" | sha256sum --check
          tar --extract --gzip --file /tmp/foundry.tar.gz --directory "$HOME/.foundry/bin"
          echo "$HOME/.foundry/bin" >> "$GITHUB_PATH"
      - run: forge fmt --check
        working-directory: contracts
      - run: forge test -vv
        working-directory: contracts

  solidity-static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install verified Foundry release
        run: |
          mkdir -p "$HOME/.foundry/bin"
          curl --fail --location --retry 3 \
            "https://github.com/foundry-rs/foundry/releases/download/${FOUNDRY_VERSION}/foundry_${FOUNDRY_VERSION}_linux_amd64.tar.gz" \
            --output /tmp/foundry.tar.gz
          echo "${FOUNDRY_SHA256}  /tmp/foundry.tar.gz" | sha256sum --check
          tar --extract --gzip --file /tmp/foundry.tar.gz --directory "$HOME/.foundry/bin"
          echo "$HOME/.foundry/bin" >> "$GITHUB_PATH"
      - uses: astral-sh/setup-uv@v6
      - run: uv tool install slither-analyzer==0.11.5
      - run: >-
          slither .
          --filter-paths 'lib|test|script'
          --exclude-dependencies
          --exclude arbitrary-send-erc20,calls-loop,cyclomatic-complexity,timestamp,unused-return
        working-directory: contracts

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          components: rustfmt, clippy
      - run: cargo fmt --check
        working-directory: core
      - run: cargo test
        working-directory: core
      - run: cargo clippy -- -D warnings
        working-directory: core

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sigma/agent test
      - run: pnpm --filter @sigma/agent build
      - run: pnpm --filter @sigma/web exec tsc --noEmit
      - run: pnpm --filter @sigma/web build
      - run: pnpm audit --prod
