name: Update live equity oracle

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate sources without publishing
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: sigma-oracle-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RH_TESTNET_RPC: https://rpc.testnet.chain.robinhood.com
      RH_TESTNET_CHAIN_ID: "46630"
      ORACLE_ADAPTER_ADDR: ${{ vars.ORACLE_ADAPTER_ADDR }}
      ORACLE_REPORTER_PRIVATE_KEY: ${{ secrets.ORACLE_REPORTER_PRIVATE_KEY }}
      ORACLE_MAX_SOURCE_DEVIATION_BPS: "200"
      ORACLE_MAX_SOURCE_AGE_SEC: "345600"
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cross-check and publish prices
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            pnpm --filter @sigma/agent oracle:update -- --dry-run
          else
            pnpm --filter @sigma/agent oracle:update
          fi
